name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  # ── Job 1: Format ──────────────────────────────────────────────────────────
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: forge fmt --check
        run: forge fmt --check

  # ── Job 2: Build ───────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: forge --version

      - name: forge build --sizes
        run: forge build --sizes

  # ── Job 3: Unit + Integration tests ───────────────────────────────────────
  test:
    name: Tests (135)
    runs-on: ubuntu-latest
    needs: [fmt, build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run all tests (verbose)
        run: forge test -vvv

      - name: Verify test count (expect 135)
        run: |
          TOTAL=$(forge test --json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          total = sum(r.get('test_results', {}) and len(r['test_results']) for r in data.values())
          print(total)
          " 2>/dev/null || echo "skip")
          echo "Total tests: $TOTAL"

  # ── Job 4: Fuzz tests (higher run count) ──────────────────────────────────
  fuzz:
    name: Fuzz (512 runs)
    runs-on: ubuntu-latest
    needs: [fmt, build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run fuzz suite with 512 runs
        run: forge test --match-contract FuzzTests --fuzz-runs 512 -v
        env:
          FOUNDRY_FUZZ_RUNS: 512

  # ── Job 5: Gas snapshot ────────────────────────────────────────────────────
  snapshot:
    name: Gas snapshot
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Generate gas snapshot (exclude fuzz)
        run: forge snapshot --no-match-contract FuzzTests

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot-${{ github.sha }}
          path: .gas-snapshot
          retention-days: 30

      - name: Print gas snapshot summary
        run: |
          echo "### Gas Snapshot" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat .gas-snapshot >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
